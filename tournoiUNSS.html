<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UNSS Gestion tournoi futsal</title>
<style>
:root{
  --bg:#0f172a;
  --bg-soft:#f4f6fb;
  --panel:#ffffff;
  --ink:#1a2238;
  --muted:#6b7488;
  --accent:#2563eb;
  --accent2:#ea580c;
  --line:#e2e6f0;
  --radius:14px;
  --col0-h:#1d4ed8; --col0-c:#e8eefc;
  --col1-h:#7c3aed; --col1-c:#f1e9fc;
  --col2-h:#db2777; --col2-c:#fbe6f0;
  --col3-h:#ea580c; --col3-c:#fde9dd;
  --col4-h:#0ea5e9; --col4-c:#e3f4fc;
  --col5-h:#ca8a04; --col5-c:#fdf1d6;
  --col6-h:#dc2626; --col6-c:#fbe2e2;
  --col7-h:#4338ca; --col7-c:#e7e5fb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0%, #16204a 0%, transparent 45%),
    radial-gradient(circle at 90% 0%, #0b1330 0%, transparent 40%),
    var(--bg-soft);
  color:var(--ink);
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}
input,select{font-family:inherit;}
.topbar{
  background:linear-gradient(120deg,#0f172a,#1e3a8a 55%,#1d4ed8);
  color:#fff;
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:50;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.topbar h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px;}
.topbar h1 .ball{filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
.backup-controls{display:flex;gap:8px;flex-wrap:wrap;}
.btn{
  border:none;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.85rem;
  background:#fff;color:#1e3a8a;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.2);}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;}
.btn.accent{background:var(--accent2);color:#fff;}
.btn.danger{background:#dc2626;color:#fff;}
.btn.small{padding:6px 10px;font-size:.78rem;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.file-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.85rem;}
.file-btn input{display:none;}

.main-tabs{
  display:flex;gap:6px;padding:10px 16px 0;background:#0f172a;
  position:sticky;top:64px;z-index:40;
}
.main-tabs button{
  flex:1;max-width:260px;padding:12px 16px;border:none;border-radius:12px 12px 0 0;
  background:#1e293b;color:#cbd5f5;font-weight:700;font-size:.95rem;
}
.main-tabs button.active{background:var(--bg-soft);color:var(--ink);}

#app{padding:16px;max-width:1500px;margin:0 auto;}

.card{background:var(--panel);border-radius:var(--radius);padding:16px 18px;box-shadow:0 2px 10px rgba(20,30,60,.08);margin-bottom:16px;border:1px solid var(--line);}
.card h2{margin:0 0 10px;font-size:1.05rem;color:#1e3a8a;display:flex;align-items:center;gap:8px;}
.card h3{margin:14px 0 8px;font-size:.95rem;color:#334155;}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .btn{margin-top:14px;}

.tournament-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.tournament-bar select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-weight:600;background:#fff;min-width:220px;}
.new-tournament-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.new-tournament-form input[type=text]{padding:9px 12px;border-radius:10px;border:1px solid var(--line);min-width:240px;}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.3px;}
.badge.setup{background:#e2e8f0;color:#475569;}
.badge.poules{background:#dbeafe;color:#1d4ed8;}
.badge.demis{background:#fef3c7;color:#92400e;}
.badge.finale{background:#fde68a;color:#78350f;}
.badge.termine{background:#1d4ed8;color:#fff;}

.estab-table{width:100%;border-collapse:collapse;}
.estab-table th,.estab-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.88rem;}
.estab-table input[type=number]{width:62px;padding:6px;border-radius:8px;border:1px solid var(--line);text-align:center;font-weight:700;}
.estab-table th{font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;}

.warn-pill{background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:10px;font-size:.82rem;font-weight:600;margin:8px 0;display:inline-block;}

#catTabsBar{
  display:flex;gap:6px;flex-wrap:wrap;
  background:#0b1330;padding:8px 16px;
  position:sticky;top:128px;z-index:42;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}
#catTabsBar.hidden{display:none;}
#catTabsBar button{padding:9px 16px;border-radius:10px;border:2px solid transparent;background:#1e293b;color:#cbd5f5;font-weight:700;font-size:.9rem;}
#catTabsBar button.active{background:#1d4ed8;color:#fff;}

.collapsible-title{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;gap:10px;}
.collapsible-title:hover{opacity:.85;}
.collapsible-title .chevron{font-size:.75rem;color:var(--muted);flex:0 0 auto;transition:transform .15s ease;display:inline-block;}
.collapsible-title .chevron.collapsed{transform:rotate(-90deg);}

.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;background:#fff;}
table.standings{min-width:520px;}
table.auto-width{width:auto;min-width:0;}
table.auto-width td,table.auto-width th{padding-right:28px;}
table.auto-width td:last-child,table.auto-width th:last-child{padding-right:12px;}
th,td{padding:8px 12px;text-align:center;white-space:nowrap;font-size:.86rem;}
td:first-child,th:first-child{text-align:left;}
tbody tr:nth-child(odd){filter:brightness(0.99);}
tbody tr:hover{filter:brightness(0.96);}
th{color:#fff;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;}
.col-0{background:var(--col0-c);} th.col-0{background:var(--col0-h);}
.col-1{background:var(--col1-c);} th.col-1{background:var(--col1-h);}
.col-2{background:var(--col2-c);} th.col-2{background:var(--col2-h);}
.col-3{background:var(--col3-c);} th.col-3{background:var(--col3-h);}
.col-4{background:var(--col4-c);} th.col-4{background:var(--col4-h);}
.col-5{background:var(--col5-c);} th.col-5{background:var(--col5-h);}
.col-6{background:var(--col6-c);} th.col-6{background:var(--col6-h);}
.col-7{background:var(--col7-c);} th.col-7{background:var(--col7-h);}
.rank1{font-weight:800;color:#1d4ed8;}

.standings-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
.standings-row>div{flex:1;min-width:280px;}

.pool-config-table{width:100%;border-collapse:collapse;margin-top:8px;}
.pool-config-table td,.pool-config-table th{padding:7px 10px;border-bottom:1px solid var(--line);font-size:.86rem;}
.pool-config-table th{color:#475569;text-transform:uppercase;letter-spacing:.3px;font-weight:700;font-size:.74rem;}
.pool-config-table select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);font-weight:600;}
.pool-config-table input[type=number]{width:62px;padding:6px;border-radius:8px;border:1px solid var(--line);text-align:center;font-weight:700;}

.pool-settings-label{font-size:.78rem;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.3px;margin:14px 0 8px;}
.pool-settings-grid{display:flex;flex-wrap:wrap;gap:14px;}
.pool-settings-card{flex:1;min-width:240px;background:linear-gradient(160deg,#f8fafc,#eef1fb);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.pool-settings-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pool-badge{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#fff;font-weight:800;font-size:.95rem;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.pool-settings-title{font-weight:800;color:var(--ink);font-size:.95rem;}
.pool-settings-sub{display:inline-block;margin-top:3px;font-size:.85rem;font-weight:800;color:#fff;background:var(--pbadge,#475569);padding:2px 10px;border-radius:999px;}
.pool-settings-body{display:flex;flex-direction:column;gap:10px;}
.pool-settings-duration{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.85rem;font-weight:600;color:#334155;}
.pool-settings-duration input{width:62px;padding:7px;border-radius:8px;border:1px solid var(--line);text-align:center;font-weight:800;font-size:.95rem;}
.toggle-switch{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-size:.85rem;font-weight:600;color:#334155;}
.toggle-switch input{position:absolute;opacity:0;width:0;height:0;}
.toggle-switch .track{width:40px;height:22px;background:#cbd5e1;border-radius:999px;position:relative;transition:background .15s;flex:0 0 auto;}
.toggle-switch .track::before{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle-switch input:checked + .track{background:#1d4ed8;}
.toggle-switch input:checked + .track::before{transform:translateX(18px);}
.generate-schedule-center{text-align:center;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);}
.btn-generate{font-size:1rem;padding:13px 32px;box-shadow:0 4px 14px rgba(234,88,12,.35);}
.auto-split-row{text-align:center;margin:2px 0 10px;}
.btn-auto-split{
  border:none;border-radius:12px;padding:13px 28px;font-weight:800;font-size:.95rem;
  background:linear-gradient(120deg,#7c3aed,#2563eb);color:#fff;cursor:pointer;
  box-shadow:0 4px 14px rgba(124,58,237,.4);transition:.15s;
}
.btn-auto-split:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(124,58,237,.5);}
.pool-settings-total{font-size:.8rem;color:#475569;background:rgba(255,255,255,.6);border-radius:8px;padding:6px 10px;text-align:center;}
.pool-total-summary{font-size:1rem;color:#1e3a8a;font-weight:600;margin-top:14px;background:#eef1fb;border:2px solid #c7d2fe;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;width:100%;box-sizing:border-box;text-align:center;}
.pool-total-summary b{font-size:1.1rem;color:#1d4ed8;}
.pool-total-summary .pool-total-grand{font-size:1.2rem;font-weight:700;border-top:1px dashed #c7d2fe;padding-top:8px;}
.pool-total-summary .pool-total-grand b{font-size:1.4rem;color:#ea580c;}
.pools-matches-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.pools-matches-row>div{flex:1;min-width:320px;}
.pool-color-block{border-left:5px solid var(--pc);background:var(--pt);border-radius:10px;padding:10px 14px;}
.pool-color-block h3{margin-top:4px;}
.pool-color-block .phase-group{background:transparent;}

.phase-group{margin-top:16px;}
.phase-title{font-weight:800;color:#1e3a8a;font-size:.92rem;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.swap-hint{font-size:.76rem;color:var(--muted);margin:-4px 0 8px;}
.swap-select{font-weight:700;font-size:.9rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;max-width:160px;}
.match-list{display:flex;flex-direction:column;gap:8px;}
.match-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);flex-wrap:wrap;
}
.match-row .teams{flex:1;min-width:180px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.match-row .teams .winner{background:#fef3c7;color:#92400e;font-weight:800;padding:2px 8px;border-radius:6px;}
.match-row .score-chip{background:#1e293b;color:#fff;border-radius:8px;padding:3px 9px;font-weight:800;font-size:.85rem;}
.match-row .vs{color:var(--muted);font-weight:600;font-size:.8rem;}
.match-row .ref{font-size:.76rem;color:var(--muted);}
.match-row .status-pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;}
.status-pill.pending{background:#e2e8f0;color:#475569;}
.status-pill.live{background:#fecaca;color:#991b1b;animation:pulse 1.4s infinite;}
.status-pill.needs_tiebreak{background:#fde68a;color:#78350f;}
.status-pill.done{background:#1d4ed8;color:#fff;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}

#liveBanner{
  position:sticky;top:186px;z-index:30;
  background:linear-gradient(120deg,#0f172a,#1e3a8a);
  color:#fff;border-radius:var(--radius);padding:48px 32px;margin-bottom:18px;
  box-shadow:0 8px 22px rgba(15,23,42,.35);
  min-height:66vh;display:flex;flex-direction:column;justify-content:center;
}
#liveBanner .label{font-size:1.8rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.9;margin-bottom:18px;text-align:center;}
.live-main{display:flex;align-items:center;justify-content:center;gap:48px;flex-wrap:wrap;}
.team-score-btn{
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:22px;
  padding:30px 40px;min-width:260px;text-align:center;color:#fff;
}
.team-score-btn:hover{background:rgba(255,255,255,.22);}
.team-score-btn .tname{font-weight:800;font-size:1.7rem;margin-bottom:14px;}
.team-score-btn .tscore{font-size:5.5rem;font-weight:900;line-height:1;}
.minus-btn{display:inline-block;margin-top:14px;background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;padding:8px 16px;font-size:1.05rem;}
#chronoDisplay{font-size:7rem;font-weight:900;letter-spacing:3px;font-variant-numeric:tabular-nums;min-width:320px;text-align:center;}
#chronoDisplay.overtime{color:#fca5a5;}
.chrono-reset-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:50%;width:34px;height:34px;font-size:1.1rem;line-height:1;cursor:pointer;flex:0 0 auto;}
.chrono-reset-btn:hover{background:rgba(255,255,255,.3);}
.live-sub{text-align:center;font-size:1.05rem;opacity:.85;margin-top:14px;}
.live-controls{display:flex;justify-content:center;gap:16px;margin-top:32px;flex-wrap:wrap;}
.live-controls .btn{font-size:1.1rem;padding:14px 24px;}
.live-abandon-link{text-align:center;font-size:.85rem;opacity:.65;margin-top:20px;}
.link-btn{background:none;border:none;padding:0;color:#fff;text-decoration:underline;cursor:pointer;font:inherit;}
.link-btn:hover{opacity:.8;}
.tiebreak-box{text-align:center;margin-top:20px;}
.tiebreak-box .btn{margin:4px;font-size:1.1rem;padding:14px 20px;}
.color-dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);vertical-align:middle;margin-right:6px;}

.bracket-wrap{overflow-x:auto;padding:10px 2px;}
.bracket{display:flex;align-items:stretch;gap:0;min-width:560px;}
.bracket-round{display:flex;flex-direction:column;justify-content:center;gap:36px;}
.bracket-slot{display:flex;flex-direction:column;gap:6px;}
.bracket-label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
.bracket-match{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:220px;box-shadow:0 2px 6px rgba(20,30,60,.08);}
.bracket-match.final{border-color:#1d4ed8;box-shadow:0 4px 14px rgba(29,78,216,.18);}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;font-size:.85rem;font-weight:600;border-bottom:1px solid var(--line);}
.brow:last-child{border-bottom:none;}
.brow.winner{background:#fef3c7;color:#92400e;font-weight:800;}
.brow.placeholder{color:var(--muted);font-style:italic;font-weight:500;}
.bscore{background:#1e293b;color:#fff;border-radius:6px;padding:2px 8px;font-weight:800;font-size:.8rem;}
.bracket-lines{width:40px;align-self:stretch;position:relative;min-height:120px;}
.bracket-lines::before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:20px;border:2px solid #cbd5e1;border-left:none;border-radius:0 10px 10px 0;}
.bracket-lines::after{content:"";position:absolute;left:20px;top:50%;width:20px;height:2px;background:#cbd5e1;}
.bracket-final-round{justify-content:center;}
.bracket-third{margin-top:24px;padding-top:18px;border-top:1px dashed var(--line);max-width:260px;}

.field-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:.78rem;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.3px;}
.field input[type=number],.field select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-weight:600;}
.checkline{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:#334155;}

@media (max-width:1024px){
  .topbar h1{font-size:1.1rem;}
  .main-tabs{top:58px;}
  #catTabsBar{top:112px;}
  #liveBanner{top:164px;min-height:56vh;padding:32px 20px;}
  #chronoDisplay{font-size:4rem;min-width:220px;}
  .team-score-btn{padding:20px 24px;min-width:180px;}
  .team-score-btn .tscore{font-size:3.4rem;}
  .team-score-btn .tname{font-size:1.2rem;}
  th,td{font-size:.8rem;padding:6px 9px;}
}
@media (max-width:640px){
  .standings-row{flex-direction:column;}
  #liveBanner{min-height:auto;padding:24px 16px;}
  .team-score-btn{min-width:130px;padding:14px 16px;}
  #chronoDisplay{font-size:3rem;min-width:0;}
}
</style>
</head>
<body>
<header class="topbar">
  <h1><span class="ball">🏆</span> UNSS Gestion tournoi futsal</h1>
  <div class="backup-controls">
    <button class="btn ghost" data-action="export-backup">💾 Exporter une sauvegarde</button>
    <label class="file-btn">📂 Importer<input type="file" id="importFile" accept="application/json"></label>
  </div>
</header>
<nav class="main-tabs">
  <button id="tabBtnM" data-action="switch-tab" data-tab="M">⚽ Futsal</button>
  <button id="tabBtnF" data-action="switch-tab" data-tab="F">⚽ Futsal Féminin</button>
</nav>
<nav id="catTabsBar" class="hidden"></nav>
<main id="app"></main>

<script>
/* ===================== CONSTANTES ===================== */
const ESTABLISHMENTS = ["Joliot Curie","Lamartine","Chabroux","Jaurès","Bertrand Tavernier","Monod","Rosset"];
const CATEGORIES_BY_TYPE = {
  M: [ {key:"benjamins", label:"Benjamins"}, {key:"minimesG", label:"Minimes Garçons"} ],
  F: [ {key:"benjamines", label:"Benjamines"}, {key:"minimesF", label:"Minimes Filles"} ]
};
const PHASE_LABELS = {
  demi1:"Demi-finale 1", demi2:"Demi-finale 2", finale:"Finale",
  cl34:"Match pour la 3e place", clDernier:"Classement des dernières places",
  cl3e:"Classement des 3e de poule"
};
const STORAGE_KEY = "unssFutsalV2";
const COLOR_PRESETS = [
  {label:"Rouge", hex:"#dc2626"}, {label:"Bleu", hex:"#2563eb"}, {label:"Vert", hex:"#16a34a"},
  {label:"Jaune", hex:"#eab308"}, {label:"Orange", hex:"#ea580c"}, {label:"Violet", hex:"#7c3aed"},
  {label:"Rose", hex:"#db2777"}, {label:"Noir", hex:"#111827"}, {label:"Blanc", hex:"#f8fafc"},
  {label:"Gris", hex:"#6b7280"}, {label:"Marron", hex:"#78350f"}, {label:"Turquoise", hex:"#0891b2"}
];

/* ===================== ETAT ===================== */
let DB = loadDB();
let uiState = { creating:false, collapsedSections:{} };
function isCollapsed(key){ return !!uiState.collapsedSections[key]; }
function toggleSection(key){ uiState.collapsedSections[key] = !uiState.collapsedSections[key]; render(); }

function emptyCatCtx(){ return { tournaments:[], currentId:null }; }
function freshDB(){
  return {
    activeTab:"M",
    activeCategory:{ M:"benjamins", F:"benjamines" },
    M:{ benjamins:emptyCatCtx(), minimesG:emptyCatCtx() },
    F:{ benjamines:emptyCatCtx(), minimesF:emptyCatCtx() }
  };
}
function isNewFormat(d){
  return !!(d && d.M && d.F && d.M.benjamins && d.M.minimesG && d.F.benjamines && d.F.minimesF);
}
function migrateOldTournament(oldT, catKey){
  const oldCs = oldT.categories ? oldT.categories[catKey] : null;
  if(!oldCs) return null;
  const estabCounts = {};
  Object.keys(oldT.etablissements||{}).forEach(estab=>{
    const n = oldT.etablissements[estab] && oldT.etablissements[estab][catKey];
    if(n) estabCounts[estab] = n;
  });
  return {
    id: oldT.id + "_" + catKey,
    nom: oldT.nom,
    dateCreation: oldT.dateCreation,
    gender: oldT.type,
    category: catKey,
    etablissements: estabCounts,
    equipes: oldCs.equipes || [],
    poules: oldCs.poules || [],
    poolCount: oldCs.poolCount || 1,
    matchDuration: oldCs.matchDuration!=null ? oldCs.matchDuration : 10,
    poolDurations: oldCs.poolDurations || [],
    poolDoubleRound: oldCs.poolDoubleRound || [],
    rankingOptions: oldCs.rankingOptions || { cl34:true, clDernier:true, cl3e:true },
    finalMode: oldCs.finalMode || "crossed",
    matches: oldCs.matches || [],
    refereeCounts: oldCs.refereeCounts || {},
    stage: oldCs.stage || "setup"
  };
}
function migrateOldDB(old){
  const next = freshDB();
  next.activeTab = old.activeTab || "M";
  ["M","F"].forEach(tab=>{
    const catDefs = CATEGORIES_BY_TYPE[tab];
    const ctx = old[tab];
    catDefs.forEach(def=>{
      const list = [];
      let currentMigratedId = null;
      if(ctx && Array.isArray(ctx.tournaments)){
        ctx.tournaments.forEach(oldT=>{
          const migrated = migrateOldTournament(oldT, def.key);
          if(migrated && (migrated.equipes.length || Object.keys(migrated.etablissements).length)){
            list.push(migrated);
            if(oldT.id === ctx.currentId) currentMigratedId = migrated.id;
          }
        });
      }
      next[tab][def.key].tournaments = list;
      next[tab][def.key].currentId = currentMigratedId || (list.length ? list[list.length-1].id : null);
    });
    next.activeCategory[tab] = catDefs[0].key;
  });
  return next;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(isNewFormat(parsed)) return parsed;
    }
    const oldRaw = localStorage.getItem("unssFutsalV1");
    if(oldRaw){
      const oldParsed = JSON.parse(oldRaw);
      if(oldParsed && oldParsed.M && oldParsed.F){
        const migrated = migrateOldDB(oldParsed);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }
    }
  }catch(e){ console.warn("Lecture sauvegarde impossible", e); }
  return freshDB();
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }

function nowSec(){ return Date.now()/1000; }
function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function teamIdFor(estab, cat, n){ return btoa(unescape(encodeURIComponent(estab))).replace(/[^A-Za-z0-9]/g,"") + "_" + cat + "_" + n; }

function applyEstablishmentConfig(t, newCounts){
  t.etablissements = newCounts;
  const newTeams = [];
  ESTABLISHMENTS.forEach(estab=>{
    const n = newCounts[estab] || 0;
    for(let i=1;i<=n;i++){
      newTeams.push({ id: teamIdFor(estab,t.category,i), nom: n>1 ? (estab+" "+i) : estab, etablissement: estab });
    }
  });
  const oldIds = t.equipes.map(e=>e.id);
  const newIds = newTeams.map(e=>e.id);
  const changed = oldIds.length!==newIds.length || oldIds.some(id=>!newIds.includes(id));
  t.equipes = newTeams;
  if(changed){
    t.poules = []; t.matches = []; t.refereeCounts = {}; t.stage = "setup";
  }
}
function updateCount(estab, val){
  const t = currentTournament();
  if(!t) return;
  const n = Math.max(0, Math.min(20, parseInt(val,10)||0));
  const counts = Object.assign({}, t.etablissements||{});
  counts[estab] = n;
  applyEstablishmentConfig(t, counts);
  saveDB(); render();
}
function addEstablishment(schoolName){
  if(!schoolName) return;
  const t = currentTournament();
  if(!t) return;
  if(!t.etablissements) t.etablissements = {};
  if(t.etablissements[schoolName]==null) t.etablissements[schoolName] = 0;
  saveDB(); render();
  const idx = Object.keys(t.etablissements).indexOf(schoolName);
  const el = document.getElementById("estabInput_"+idx);
  if(el) el.focus();
}
function removeEstablishment(schoolName){
  const t = currentTournament();
  if(!t) return;
  if(!confirm("Retirer " + schoolName + " de ce tournoi ? Ses équipes et matchs associés seront supprimés.")) return;
  const counts = Object.assign({}, t.etablissements||{});
  delete counts[schoolName];
  applyEstablishmentConfig(t, counts);

}

/* ===================== POULES ===================== */
function setPoolCount(n){
  const t = currentTournament(); if(!t) return;
  n = parseInt(n,10);
  if(t.matches.length && !confirm("Changer le nombre de poules réinitialisera le calendrier des matchs de ce tournoi. Continuer ?")) { render(); return; }
  t.poolCount = n;
  t.poules = Array.from({length:n}, ()=>[]);
  t.poolDurations = Array.from({length:n}, (_, i)=> (t.poolDurations && t.poolDurations[i]) || t.matchDuration);
  t.poolDoubleRound = Array.from({length:n}, (_, i)=> !!(t.poolDoubleRound && t.poolDoubleRound[i]));
  t.matches = []; t.refereeCounts = {}; t.stage = "setup";
  saveDB(); render();
}
function setPoolDuration(poolIndex, val){
  const t = currentTournament(); if(!t) return;
  if(!t.poolDurations) t.poolDurations = [];
  t.poolDurations[poolIndex] = Math.max(1, Math.min(90, parseInt(val,10)||10));
  saveDB(); render();
}
function togglePoolDoubleRound(poolIndex, checked){
  const t = currentTournament(); if(!t) return;
  if(!t.poolDoubleRound) t.poolDoubleRound = [];
  const hadMatches = t.matches.length>0;
  if(hadMatches && !confirm("Changer ce réglage réinitialisera le calendrier des matchs de ce tournoi. Continuer ?")){ render(); return; }
  t.poolDoubleRound[poolIndex] = checked;
  if(hadMatches){ t.matches = []; t.refereeCounts = {}; t.stage = "setup"; }

  const teams = t.equipes.slice().sort((a,b)=> a.etablissement.localeCompare(b.etablissement) || a.nom.localeCompare(b.nom));

/* ===================== GENERATION CALENDRIER ===================== */
function roundRobinRounds(ids, doubleRound){
  const teams = ids.slice();
  if(teams.length % 2 !== 0) teams.push(null);
  const n = teams.length;
  const half = n/2;
  let arr = teams.slice();
  const rounds = [];
  for(let r=0;r<n-1;r++){
    const pairs = [];
    for(let i=0;i<half;i++){
      const a = arr[i], b = arr[n-1-i];
      if(a!=null && b!=null) pairs.push([a,b]);
    }
    rounds.push(pairs);
    const last = arr[n-1];
    for(let i=n-1;i>1;i--) arr[i]=arr[i-1];
    arr[1]=last;
  }
  if(doubleRound){
    const returnLeg = rounds.map(pairs=> pairs.map(([a,b])=>[b,a]));
    return rounds.concat(returnLeg);
  }
  return rounds;
}
function poolMatchCount(cs, poolIndex){
  const n = cs.poules[poolIndex] ? cs.poules[poolIndex].length : 0;
  if(n<2) return 0;
  const single = n*(n-1)/2;
  const dbl = !!(cs.poolDoubleRound && cs.poolDoubleRound[poolIndex]);
  return dbl ? single*2 : single;
}
function estimateFinalPhaseMatches(cs){
  if(cs.poolCount<2) return 0;
  const sizes = [];
  for(let i=0;i<cs.poolCount;i++) sizes.push(cs.poules[i] ? cs.poules[i].length : 0);
  if(sizes.some(s=>s<2)) return 0;
  if(cs.poolCount===2){
    if(cs.finalMode==="sameRank") return Math.min(sizes[0], sizes[1]);
    let count = 3; // demi1, demi2, finale
    if(cs.rankingOptions.cl34) count++;
    if(cs.rankingOptions.clDernier) count++;
    if(cs.rankingOptions.cl3e && sizes[0]>=4 && sizes[1]>=4) count++;
    return count;
  }
  if(cs.finalMode==="sameRank"){
    const minSize = Math.min(...sizes);
    const perTier = cs.poolCount*(cs.poolCount-1)/2;
    return minSize*perTier;
  }
  return 2*cs.poolCount - 1; // tableau à élimination directe : K participants = K-1 matchs
}
function formatMinutes(mins){
  if(mins<60) return mins+" min";
  const h = Math.floor(mins/60), m = mins%60;
  return h+"h"+(m? String(m).padStart(2,"0") : "");
}
function newMatch(phase, poolIndex, a, b, round){
  return {
    id: uid(), phase, poolIndex, round: round!=null?round:null, teamA:a, teamB:b, refereeTeamId:null,
    scoreA:0, scoreB:0, status:"pending", resultType:null, shootoutWinner:null,
    timer:{ running:false, startedAt:null, accumulatedSec:0 }
  };
}
function assignRefereesInOrder(cs, matches){
  matches.forEach(m=>{
    const candidates = cs.equipes.filter(e=> e.id!==m.teamA && e.id!==m.teamB).map(e=>e.id);
    if(!candidates.length){ m.refereeTeamId = null; return; }
    candidates.sort((x,y)=> (cs.refereeCounts[x]||0)-(cs.refereeCounts[y]||0) || x.localeCompare(y));
    const chosen = candidates[0];
    m.refereeTeamId = chosen;
    cs.refereeCounts[chosen] = (cs.refereeCounts[chosen]||0) + 1;
  });
}
function assignRefereesForPoolMatches(cs, matches){
  const byRound = {};
  matches.forEach(m=>{ (byRound[m.round]=byRound[m.round]||[]).push(m); });
  Object.keys(byRound).forEach(r=>{
    const roundMatches = byRound[r];
    const busy = new Set();
    roundMatches.forEach(m=>{ busy.add(m.teamA); busy.add(m.teamB); });
    roundMatches.forEach(m=>{
      const allCandidates = cs.equipes.filter(e=> e.id!==m.teamA && e.id!==m.teamB).map(e=>e.id);
      if(!allCandidates.length){ m.refereeTeamId = null; return; }
      const free = allCandidates.filter(id=> !busy.has(id));
      const pool = free.length ? free : allCandidates;
      pool.sort((x,y)=> (cs.refereeCounts[x]||0)-(cs.refereeCounts[y]||0) || x.localeCompare(y));
      const chosen = pool[0];
      m.refereeTeamId = chosen;
      cs.refereeCounts[chosen] = (cs.refereeCounts[chosen]||0) + 1;
    });
  });
}
function genSchedule(){
  const t = currentTournament(); if(!t) return;
  if(t.poolCount===1) t.poules = [t.equipes.map(e=>e.id)];
  const allAssigned = t.equipes.every(e=> t.poules.some(p=>p.includes(e.id)));
  const poolsOk = t.poules.length===t.poolCount && t.poules.every(p=>p.length>=2);
  if(!t.equipes.length){ alert("Aucune équipe configurée pour ce tournoi."); return; }
  if(!allAssigned || !poolsOk){ alert("Merci d'affecter toutes les équipes à une poule (au moins 2 équipes par poule)."); return; }
  if(t.matches.length && !confirm("Regénérer le calendrier effacera les résultats existants. Continuer ?")) return;
  t.refereeCounts = {};
  const poolRounds = t.poules.map((teamIds,idx)=>roundRobinRounds(teamIds, t.poolDoubleRound && t.poolDoubleRound[idx]));
  const maxRounds = Math.max(...poolRounds.map(r=>r.length));
  const matches = [];
  for(let r=0;r<maxRounds;r++){
    poolRounds.forEach((rounds, idx)=>{
      const round = rounds[r];
      if(!round) return;
      round.forEach(([a,b]) => matches.push(newMatch("poule", idx, a, b, r)));
    });
  }
  assignRefereesForPoolMatches(t, matches);
  t.matches = matches;
  t.stage = "poules";
  saveDB(); render();
}

/* ===================== CLASSEMENTS ===================== */
function computeStandingsFor(cs, teamIds, filterFn){
  const map = {};
  teamIds.forEach(id=> map[id] = { id, pts:0, j:0, v:0, n:0, d:0, ab:0, bp:0, bc:0 });
  cs.matches.filter(filterFn).filter(m=>m.status==="done").forEach(m=>{
    const a = map[m.teamA], b = map[m.teamB];
    if(!a || !b) return;
    a.j++; b.j++; a.bp += m.scoreA; a.bc += m.scoreB; b.bp += m.scoreB; b.bc += m.scoreA;
    if(m.resultType==="abandonA"){ a.ab++; b.v++; b.pts+=4; }
    else if(m.resultType==="abandonB"){ b.ab++; a.v++; a.pts+=4; }
    else if(m.scoreA>m.scoreB){ a.v++; a.pts+=4; b.d++; b.pts+=1; }
    else if(m.scoreB>m.scoreA){ b.v++; b.pts+=4; a.d++; a.pts+=1; }
    else { a.n++; b.n++; a.pts+=2; b.pts+=2; }
  });
  return teamIds.map(id=>map[id]).sort((x,y)=> y.pts-x.pts || (y.bp-y.bc)-(x.bp-x.bc) || y.bp-x.bp);
}
function poolStandings(cs, poolIndex){
  const teamIds = cs.poules[poolIndex] || [];
  return computeStandingsFor(cs, teamIds, m=>m.phase==="poule" && m.poolIndex===poolIndex);
}
function overallStandings(cs){
  return computeStandingsFor(cs, cs.equipes.map(e=>e.id), ()=>true);
}

/* ===================== PROGRESSION PHASES FINALES ===================== */
function winnerOf(m){
  if(m.resultType==="abandonA") return m.teamB;
  if(m.resultType==="abandonB") return m.teamA;
  if(m.scoreA>m.scoreB) return m.teamA;
  if(m.scoreB>m.scoreA) return m.teamB;
  return m.shootoutWinner || m.teamA;
}
function loserOf(m){ const w = winnerOf(m); return w===m.teamA ? m.teamB : m.teamA; }

function computeSameRankRankingN(cs){
  const standingsByPool = [];
  for(let p=0;p<cs.poolCount;p++) standingsByPool.push(poolStandings(cs,p));
  const minLen = Math.min(...standingsByPool.map(s=>s.length));
  const groups = [];
  for(let i=0;i<minLen;i++){
    const tierTeamIds = standingsByPool.map(s=>s[i].id);
    const tierStandings = computeStandingsFor(cs, tierTeamIds, m=>typeof m.phase==="string" && m.phase.indexOf("rtier"+i+"_")===0);
    let idx=0;
    while(idx<tierStandings.length){
      const ref = tierStandings[idx];
      const tied=[ref.id];
      let j=idx+1;
      while(j<tierStandings.length && tierStandings[j].pts===ref.pts && (tierStandings[j].bp-tierStandings[j].bc)===(ref.bp-ref.bc) && tierStandings[j].bp===ref.bp){
        tied.push(tierStandings[j].id); j++;
      }
      groups.push({teamIds:tied, tied:tied.length>1});
      idx=j;
    }
  }
  const maxLen = Math.max(...standingsByPool.map(s=>s.length));
  for(let pos=minLen; pos<maxLen; pos++){
    const tierTeams = [];
    standingsByPool.forEach(s=>{ if(s[pos]) tierTeams.push(s[pos].id); });
    if(tierTeams.length) groups.push({teamIds:tierTeams, tied:tierTeams.length>1});
  }
  return groups;
}
function computeEliminationRankingN(cs){
  const elimMatches = cs.matches.filter(m=>typeof m.phase==="string" && m.phase.indexOf("elimR")===0);
  if(!elimMatches.length) return null;
  let maxRound = 0;
  elimMatches.forEach(m=>{ const r=parseInt(m.phase.split("_")[0].replace("elimR",""),10); if(r>maxRound) maxRound=r; });
  const finalRoundMatches = elimMatches.filter(m=>parseInt(m.phase.split("_")[0].replace("elimR",""),10)===maxRound);
  if(finalRoundMatches.length!==1 || finalRoundMatches[0].status!=="done") return null;
  const finalMatch = finalRoundMatches[0];
  const groups = [];
  groups.push({teamIds:[winnerOf(finalMatch)], tied:false});
  groups.push({teamIds:[loserOf(finalMatch)], tied:false});
  for(let r=maxRound-1; r>=1; r--){
    const roundMatches = elimMatches.filter(m=>parseInt(m.phase.split("_")[0].replace("elimR",""),10)===r && m.teamB!=null);
    if(!roundMatches.length) continue;
    const losers = roundMatches.map(m=>loserOf(m));
    if(losers.length) groups.push({teamIds:losers, tied: losers.length>1});
  }
  const standingsByPool = [];
  for(let p=0;p<cs.poolCount;p++) standingsByPool.push(poolStandings(cs,p));
  const maxLen = Math.max(...standingsByPool.map(s=>s.length));
  for(let pos=2; pos<maxLen; pos++){
    const tierTeams = [];
    standingsByPool.forEach(s=>{ if(s[pos]) tierTeams.push(s[pos].id); });
    if(tierTeams.length) groups.push({teamIds:tierTeams, tied:tierTeams.length>1});
  }
  return groups;
}
function computeFinalRanking(cs){
  if(cs.poolCount<2 || cs.stage!=="terminé") return null;
  if(cs.poolCount>=3){
    return cs.finalMode==="sameRank" ? computeSameRankRankingN(cs) : computeEliminationRankingN(cs);
  }
  if(cs.finalMode==="sameRank"){
    const rangMatches = cs.matches.filter(m=>typeof m.phase==="string" && m.phase.indexOf("rang")===0)
      .sort((a,b)=>parseInt(a.phase.replace("rang",""),10)-parseInt(b.phase.replace("rang",""),10));
    if(!rangMatches.length || !rangMatches.every(m=>m.status==="done")) return null;
    const flat = [];
    rangMatches.forEach(m=>{
      flat.push({teamIds:[winnerOf(m)], tied:false});
      flat.push({teamIds:[loserOf(m)], tied:false});
    });
    return flat;
  }
  const finale = cs.matches.find(m=>m.phase==="finale");
  if(!finale || finale.status!=="done") return null;
  const demi1 = cs.matches.find(m=>m.phase==="demi1");
  const demi2 = cs.matches.find(m=>m.phase==="demi2");
  const s0 = poolStandings(cs,0), s1 = poolStandings(cs,1);
  const groups = [];
  groups.push({teamIds:[winnerOf(finale)], tied:false});
  groups.push({teamIds:[loserOf(finale)], tied:false});
  const cl34 = cs.matches.find(m=>m.phase==="cl34");
  if(cl34 && cl34.status==="done"){
    groups.push({teamIds:[winnerOf(cl34)], tied:false});
    groups.push({teamIds:[loserOf(cl34)], tied:false});
  } else if(demi1 && demi2){
    groups.push({teamIds:[loserOf(demi1), loserOf(demi2)], tied:true});
  }
  const cl3e = cs.matches.find(m=>m.phase==="cl3e");
  if(cl3e && cl3e.status==="done"){
    groups.push({teamIds:[winnerOf(cl3e)], tied:false});
    groups.push({teamIds:[loserOf(cl3e)], tied:false});
  } else if(s0.length>=4 && s1.length>=4){
    groups.push({teamIds:[s0[2].id, s1[2].id], tied:true});
  }
  const clDernier = cs.matches.find(m=>m.phase==="clDernier");
  if(clDernier && clDernier.status==="done"){
    groups.push({teamIds:[winnerOf(clDernier)], tied:false});
    groups.push({teamIds:[loserOf(clDernier)], tied:false});
  } else if(s0.length && s1.length){
    groups.push({teamIds:[s0[s0.length-1].id, s1[s1.length-1].id], tied:true});
  }
  const seen = new Set();
  const flat = [];
  groups.forEach(g=>{
    const ids = g.teamIds.filter(id=>!seen.has(id));
    ids.forEach(id=>seen.add(id));
    if(ids.length) flat.push({teamIds:ids, tied:g.tied && ids.length>1});
  });
  const leftover = cs.equipes.map(e=>e.id).filter(id=>!seen.has(id));
  if(leftover.length) flat.push({teamIds:leftover, tied:leftover.length>1});
  return flat;
}

function setFinalMode(mode){
  const t = currentTournament(); if(!t) return;
  const hasFinalMatches = t.matches.some(m=>m.phase!=="poule");
  if(hasFinalMatches){
    if(!confirm("Changer le mode de phase finale réinitialisera les matchs de phase finale déjà générés. Continuer ?")){ render(); return; }
    t.matches = t.matches.filter(m=>m.phase==="poule");
    t.stage = "poules";
  }
  t.finalMode = mode;
  saveDB();
  maybeGenerateFinalPhase();
  render();
}
function generateSameRankPhaseN(cs, pouleDone){
  const hasTier = cs.matches.some(m=>typeof m.phase==="string" && m.phase.indexOf("rtier")===0);
  if(pouleDone && !hasTier){
    const standingsByPool = [];
    for(let p=0;p<cs.poolCount;p++) standingsByPool.push(poolStandings(cs,p));
    const minLen = Math.min(...standingsByPool.map(s=>s.length));
    const extra = [];
    for(let i=0;i<minLen;i++){
      const tierTeamIds = standingsByPool.map(s=>s[i].id);
      const rounds = roundRobinRounds(tierTeamIds, false);
      rounds.forEach((round,ri)=>{
        round.forEach(([a,b],mi)=>{
          extra.push(newMatch("rtier"+i+"_"+ri+"_"+mi, null, a, b));
        });
      });
    }
    assignRefereesInOrder(cs, extra);
    cs.matches.push(...extra);
    cs.stage = "finale";
  }
  const tierMatches = cs.matches.filter(m=>typeof m.phase==="string" && m.phase.indexOf("rtier")===0);
  if(tierMatches.length && tierMatches.every(m=>m.status==="done")) cs.stage = "terminé";
}
function advanceEliminationRounds(cs){
  let round = 1;
  while(true){
    const roundMatches = cs.matches.filter(m=> m.phase && m.phase.indexOf("elimR"+round+"_")===0);
    if(!roundMatches.length) return;
    if(!roundMatches.every(m=>m.status==="done")) return;
    if(roundMatches.length===1) return;
    const already = cs.matches.some(m=> m.phase && m.phase.indexOf("elimR"+(round+1)+"_")===0);
    if(!already){
      const winners = roundMatches.slice()
        .sort((a,b)=> parseInt(a.phase.split("_")[1],10)-parseInt(b.phase.split("_")[1],10))
        .map(m=>winnerOf(m));
      const extra = [];
      for(let i=0;i<winners.length;i+=2){
        const bTeam = winners[i+1]!=null ? winners[i+1] : null;
        extra.push(newMatch("elimR"+(round+1)+"_"+(i/2), null, winners[i], bTeam));
      }
      extra.forEach(m=>{ if(m.teamB==null){ m.status = "done"; m.resultType = "normal"; } });
      assignRefereesInOrder(cs, extra.filter(m=>m.teamB!=null));
      cs.matches.push(...extra);
    }
    round++;
  }
}
function generateEliminationBracket(cs, pouleDone){
  const hasElim = cs.matches.some(m=>typeof m.phase==="string" && m.phase.indexOf("elimR")===0);
  if(pouleDone && !hasElim){
    const standingsByPool = [];
    for(let p=0;p<cs.poolCount;p++) standingsByPool.push(poolStandings(cs,p));
    if(standingsByPool.every(s=>s.length>=2)){
      const order = [];
      for(let p=0;p<cs.poolCount;p++) order.push(standingsByPool[p][0].id);
      for(let p=0;p<cs.poolCount;p++) order.push(standingsByPool[p][1].id);
      const extra = [];
      for(let i=0;i<order.length;i+=2){
        const bTeam = order[i+1]!=null ? order[i+1] : null;
        extra.push(newMatch("elimR1_"+(i/2), null, order[i], bTeam));
      }
      extra.forEach(m=>{ if(m.teamB==null){ m.status = "done"; m.resultType = "normal"; } });
      assignRefereesInOrder(cs, extra.filter(m=>m.teamB!=null));
      cs.matches.push(...extra);
      cs.stage = "finale";
    }
  }
  advanceEliminationRounds(cs);
  const elimMatches = cs.matches.filter(m=>typeof m.phase==="string" && m.phase.indexOf("elimR")===0);
  if(elimMatches.length){
    let maxRound = 0;
    elimMatches.forEach(m=>{ const r=parseInt(m.phase.split("_")[0].replace("elimR",""),10); if(r>maxRound) maxRound=r; });
    const lastRoundMatches = elimMatches.filter(m=>parseInt(m.phase.split("_")[0].replace("elimR",""),10)===maxRound);
    if(lastRoundMatches.length===1 && lastRoundMatches[0].status==="done"){
      cs.stage = "terminé";
    }
  }
}
function maybeGenerateFinalPhase(){
  const t = currentTournament(); if(!t) return;
  const cs = t;
  if(cs.poolCount<2){
    if(cs.matches.length && cs.matches.every(m=>m.status==="done")) cs.stage = "terminé";
    saveDB(); return;
  }
  const pouleMatches = cs.matches.filter(m=>m.phase==="poule");
  const pouleDone = pouleMatches.length>0 && pouleMatches.every(m=>m.status==="done");
  if(cs.poolCount>=3){
    if(cs.finalMode==="sameRank") generateSameRankPhaseN(cs, pouleDone);
    else generateEliminationBracket(cs, pouleDone);
    saveDB();
    return;
  }
  if(cs.finalMode==="sameRank"){
    const hasRang = cs.matches.some(m=>typeof m.phase==="string" && m.phase.indexOf("rang")===0);
    if(pouleDone && !hasRang){
      const s0 = poolStandings(cs,0), s1 = poolStandings(cs,1);
      const n = Math.min(s0.length, s1.length);
      const extra = [];
      for(let i=0;i<n;i++) extra.push(newMatch("rang"+(i+1), null, s0[i].id, s1[i].id));
      assignRefereesInOrder(cs, extra);
      cs.matches.push(...extra);
      cs.stage = "finale";
    }
    if(cs.matches.length && cs.matches.every(m=>m.status==="done") && cs.matches.some(m=>typeof m.phase==="string" && m.phase.indexOf("rang")===0)){
      cs.stage = "terminé";
    }
    saveDB();
    return;
  }
  const hasDemis = cs.matches.some(m=>m.phase==="demi1");
  if(pouleDone && !hasDemis){
    const s0 = poolStandings(cs,0), s1 = poolStandings(cs,1);
    const extra = [];
    if(s0.length>=2 && s1.length>=2){
      extra.push(newMatch("demi1", null, s0[0].id, s1[1].id));
      extra.push(newMatch("demi2", null, s1[0].id, s0[1].id));
    }
    if(cs.rankingOptions.clDernier && s0.length && s1.length){
      extra.push(newMatch("clDernier", null, s0[s0.length-1].id, s1[s1.length-1].id));
    }
    if(cs.rankingOptions.cl3e && s0.length>=4 && s1.length>=4){
      extra.push(newMatch("cl3e", null, s0[2].id, s1[2].id));
    }
    assignRefereesInOrder(cs, extra);
    cs.matches.push(...extra);
    cs.stage = "demis";
  }
  const demi1 = cs.matches.find(m=>m.phase==="demi1");
  const demi2 = cs.matches.find(m=>m.phase==="demi2");
  const hasFinale = cs.matches.some(m=>m.phase==="finale");
  if(demi1 && demi2 && demi1.status==="done" && demi2.status==="done" && !hasFinale){
    const w1=winnerOf(demi1), l1=loserOf(demi1), w2=winnerOf(demi2), l2=loserOf(demi2);
    const extra = [ newMatch("finale", null, w1, w2) ];
    if(cs.rankingOptions.cl34) extra.push(newMatch("cl34", null, l1, l2));
    assignRefereesInOrder(cs, extra);
    cs.matches.push(...extra);
    cs.stage = "finale";
  }
  if(cs.matches.length && cs.matches.every(m=>m.status==="done") && cs.matches.some(m=>m.phase==="finale")){
    cs.stage = "terminé";
  }
  saveDB();
}

/* ===================== DEROULE D'UN MATCH ===================== */
function matchDurationMinutes(cs, m){
  if(cs.matchDuration!=null) return cs.matchDuration;
  if(m.phase==="poule" && cs.poolDurations && cs.poolDurations[m.poolIndex]!=null) return cs.poolDurations[m.poolIndex];
  return 10;
}
function remainingSeconds(cs, m){
  const elapsed = m.timer.accumulatedSec + (m.timer.running ? (nowSec()-m.timer.startedAt) : 0);
  return matchDurationMinutes(cs,m)*60 - elapsed;
}
function formatRemaining(cs, m){
  const rem = remainingSeconds(cs,m);
  const over = rem<0;
  const abs = Math.abs(Math.round(rem));
  const mm = Math.floor(abs/60).toString().padStart(2,"0");
  const ss = Math.floor(abs%60).toString().padStart(2,"0");
  return (over?"+":"") + mm + ":" + ss;
}
function stopTimer(m){
  if(m.timer.running){
    m.timer.accumulatedSec += nowSec() - m.timer.startedAt;
    m.timer.running = false; m.timer.startedAt = null;
  }
}
function startMatch(id){
  const live = liveMatchGlobal();
  if(live && live.m.id!==id){ alert("Un match est déjà en cours dans ce tournoi. Terminez-le ou déclarez un abandon avant d'en démarrer un autre."); return; }
  const {m} = findMatch(id);
  if(!m) return;
  m.status = "live"; m.timer.running = true; m.timer.startedAt = nowSec();
  saveDB(); render();
}
function pauseMatch(id){ const {m}=findMatch(id); if(!m) return; stopTimer(m); saveDB(); render(); }
function resumeMatch(id){ const {m}=findMatch(id); if(!m) return; m.timer.running=true; m.timer.startedAt=nowSec(); saveDB(); render(); }
function resetTimer(id){
  const {m} = findMatch(id);
  if(!m) return;
  if(!confirm("Remettre le chrono au début (durée réglée) ?")) return;
  m.timer.accumulatedSec = 0;
  if(m.timer.running) m.timer.startedAt = nowSec();
  saveDB(); render();
}
function addGoal(id, slot, delta){
  const {m}=findMatch(id); if(!m || m.status!=="live") return;
  if(slot==="A") m.scoreA = Math.max(0, m.scoreA+delta);
  else m.scoreB = Math.max(0, m.scoreB+delta);
  saveDB(); render();
}
function finishMatch(id){
  const {m} = findMatch(id);
  if(!m) return;
  stopTimer(m);
  if(m.scoreA===m.scoreB && m.phase!=="poule"){
    m.status = "needs_tiebreak";
    saveDB(); render(); return;
  }
  m.resultType = m.scoreA===m.scoreB ? "nul" : "normal";
  m.status = "done";
  saveDB();
  maybeGenerateFinalPhase();
  render();
}
function setShootoutWinner(id, team){
  const {m} = findMatch(id);
  if(!m) return;
  m.shootoutWinner = team;
  m.resultType = "nul";
  m.status = "done";
  saveDB();
  maybeGenerateFinalPhase();
  render();
}
function abandonMatch(id, slot){
  const {m} = findMatch(id);
  if(!m) return;
  if(!confirm("Confirmer l'abandon de cette équipe pour ce match ?")) return;
  stopTimer(m);
  m.resultType = slot==="A" ? "abandonA" : "abandonB";
  m.status = "done";
  saveDB();
  maybeGenerateFinalPhase();
  render();
}
function cascadeRemoveDependents(cs, m){
  if(m.phase==="poule"){
    if(cs.matches.some(x=>x.phase!=="poule")){
      cs.matches = cs.matches.filter(x=>x.phase==="poule");
      cs.stage = "poules";
    }
  } else if(m.phase==="demi1" || m.phase==="demi2"){
    if(cs.matches.some(x=>x.phase==="finale" || x.phase==="cl34")){
      cs.matches = cs.matches.filter(x=>x.phase!=="finale" && x.phase!=="cl34");
      cs.stage = "demis";
    }
  } else if(typeof m.phase==="string" && m.phase.indexOf("elimR")===0){
    const round = parseInt(m.phase.split("_")[0].replace("elimR",""),10);
    const hasLater = cs.matches.some(x=> typeof x.phase==="string" && x.phase.indexOf("elimR")===0 && parseInt(x.phase.split("_")[0].replace("elimR",""),10) > round);
    if(hasLater){
      cs.matches = cs.matches.filter(x=> !(typeof x.phase==="string" && x.phase.indexOf("elimR")===0 && parseInt(x.phase.split("_")[0].replace("elimR",""),10) > round));
      cs.stage = "finale";
    }
  } else if(cs.stage==="terminé"){
    cs.stage = "finale";
  }
}
function reopenMatch(id){
  const {cs, m} = findMatch(id);
  if(!m) return;
  const live = liveMatchGlobal();
  if(live && live.m.id!==id){ alert("Un match est déjà en cours. Terminez-le avant de corriger un autre match."); return; }
  if(!confirm("Rouvrir ce match pour le corriger ? Les matchs de phase finale déjà générés à partir de ce résultat seront supprimés et devront être régénérés.")) return;
  cascadeRemoveDependents(cs, m);
  m.status = "live";
  m.resultType = null;
  m.shootoutWinner = null;
  m.timer = { running:false, startedAt:null, accumulatedSec:0 };
  saveDB(); render();
}
function fixRefereeConflict(cs, m){
  if(m.refereeTeamId && (m.refereeTeamId===m.teamA || m.refereeTeamId===m.teamB)){
    const candidates = cs.equipes.filter(e=> e.id!==m.teamA && e.id!==m.teamB).map(e=>e.id);
    if(candidates.length){
      candidates.sort((x,y)=> (cs.refereeCounts[x]||0)-(cs.refereeCounts[y]||0) || x.localeCompare(y));
      m.refereeTeamId = candidates[0];
    } else {
      m.refereeTeamId = null;
    }
  }
}
function swapMatchTeam(matchId, slot, otherMatchId, otherSlot){
  const t = currentTournament(); if(!t) return;
  const m1 = t.matches.find(x=>x.id===matchId);
  const m2 = t.matches.find(x=>x.id===otherMatchId);
  if(!m1 || !m2) return;
  if(m1.id===m2.id && slot===otherSlot) return;
  const val1 = slot==="A" ? m1.teamA : m1.teamB;
  const val2 = otherSlot==="A" ? m2.teamA : m2.teamB;
  if(slot==="A") m1.teamA = val2; else m1.teamB = val2;
  if(otherSlot==="A") m2.teamA = val1; else m2.teamB = val1;
  fixRefereeConflict(t, m1);
  fixRefereeConflict(t, m2);
  saveDB(); render();
}
function handleSwap(matchId, slot, value){
  const parts = value.split("|");
  swapMatchTeam(matchId, slot, parts[0], parts[1]);
}

/* ===================== SAUVEGARDE / RESTAURATION ===================== */
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "unss-futsal-sauvegarde-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      let finalData = null;
      if(isNewFormat(data)) finalData = data;
      else if(data && data.M && data.F) finalData = migrateOldDB(data);
      if(!finalData){ alert("Fichier invalide."); return; }
      if(!confirm("Importer remplacera toutes les données actuelles. Continuer ?")) return;
      DB = finalData;
      uiState = { creating:false, collapsedSections:{} };
      saveDB(); render();
    }catch(e){ alert("Fichier invalide : " + e.message); }
  };
  reader.readAsText(file);
}

/* ===================== RENDU ===================== */
function dataTable(headers, rows){
  let h = '<div class="table-wrap"><table class="standings"><thead><tr>';
  h += headers.map((hd,i)=>'<th class="col-'+(i%8)+'">'+hd+'</th>').join("");
  h += '</tr></thead><tbody>';
  rows.forEach(r=>{
    h += '<tr>' + r.map((cell,i)=>'<td class="col-'+(i%8)+'">'+cell+'</td>').join("") + '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}
const POOL_PALETTE = [
  {solid:"#1d4ed8", tint:"#dbeafe"}, // bleu
  {solid:"#ef4444", tint:"#fee2e2"}, // rouge
  {solid:"#ea580c", tint:"#ffedd5"}, // orange
  {solid:"#7c3aed", tint:"#ede9fe"}, // violet
  {solid:"#db2777", tint:"#fce7f3"}, // rose
  {solid:"#0ea5e9", tint:"#e0f2fe"}  // bleu ciel
];
function poolColorVar(i){ return POOL_PALETTE[i%POOL_PALETTE.length].solid; }
function poolTintVar(i){ return POOL_PALETTE[i%POOL_PALETTE.length].tint; }
function standingsTable(cs, standings, title, poolIndex){
  const headers = ["#","Équipe","Pts","J","V","N","D","BP","BC","Diff"];
  const rows = standings.map((s,i)=>[
    (i===0? '<span class="rank1">1</span>' : (i+1)),
    esc(teamName(cs,s.id)), "<b>"+s.pts+"</b>", s.j, s.v, s.n, s.d, s.bp, s.bc, (s.bp-s.bc>0?"+":"")+(s.bp-s.bc)
  ]);
  if(poolIndex!=null) return dataTable(headers, rows);
  return '<h3>'+title+'</h3>' + dataTable(headers, rows);
}
function statusLabel(m){
  if(m.status==="pending") return "À jouer";
  if(m.status==="live") return "En cours";
  if(m.status==="needs_tiebreak") return "Tirs au but";
  if(m.status==="done") return "Terminé";
  return m.status;
}
function resultBadgeText(cs, m){
  if(m.status!=="done") return "";
  if(m.resultType==="abandonA") return esc(teamName(cs,m.teamB)) + " qualifié (abandon)";
  if(m.resultType==="abandonB") return esc(teamName(cs,m.teamA)) + " qualifié (abandon)";
  if(m.resultType==="nul" && m.shootoutWinner) return "Nul – " + esc(teamName(cs,m.shootoutWinner)) + " qualifié aux T.A.B.";
  if(m.resultType==="nul") return "Match nul";
  if(m.resultType==="normal") return esc(teamName(cs, winnerOf(m))) + " vainqueur";
  return "Terminé";
}
function matchWinnerId(m){
  if(m.status!=="done") return null;
  if(m.teamB==null) return m.teamA;
  if(m.resultType==="abandonA") return m.teamB;
  if(m.resultType==="abandonB") return m.teamA;
  if(m.scoreA>m.scoreB) return m.teamA;
  if(m.scoreB>m.scoreA) return m.teamB;
  if(m.resultType==="nul" && m.shootoutWinner) return m.shootoutWinner;
  return null;
}
function renderMatchRow(cs, m, canStart, swapCtx){
  const refName = m.refereeTeamId ? esc(teamName(cs,m.refereeTeamId)) : "—";
  const winnerId = matchWinnerId(m);
  const scoreHtml = m.status==="pending"
    ? '<span class="vs">vs</span>'
    : '<span class="score-chip">'+m.scoreA+' - '+m.scoreB+'</span>';
  let actions = "";
  if(m.status==="pending"){
    actions = '<button class="btn small accent" data-action="start-match" data-id="'+m.id+'" '+(canStart?"":"disabled")+'>▶ Démarrer</button>';
  } else if(m.status==="live" || m.status==="needs_tiebreak"){
    actions = '<button class="btn small" data-action="scroll-live">⬆ Voir le match en cours</button>';
  } else {
    const badge = m.resultType!=="normal" ? '<span class="status-pill done">'+esc(resultBadgeText(cs,m))+'</span>' : '';
    actions = badge + ' <button class="btn small ghost" style="color:#334155;background:#eef1fb" data-action="reopen-match" data-id="'+m.id+'" '+(canStart?"":"disabled")+' title="Corriger ce match">↺ Corriger</button>';
  }
  const canSwap = !!(swapCtx && m.status==="pending" && m.teamB!=null);
  const teamCell = (slot)=>{
    const teamId = slot==="A" ? m.teamA : m.teamB;
    const isWinner = winnerId===teamId;
    if(canSwap){
      const options = swapCtx.slots.map(s=>
        '<option value="'+s.matchId+'|'+s.slot+'" '+(s.matchId===m.id && s.slot===slot ? "selected":"")+'>'+esc(teamName(cs,s.teamId))+'</option>'
      ).join("");

function rangLabel(phase){
  const n = parseInt(phase.replace("rang",""),10);
  const first = 2*(n-1)+1, second = first+1;
  return n===1 ? "Finale — 1ers de poule (places "+first+"-"+second+")" : "Classement — places "+first+"-"+second;
}
function tierLabel(key){
  const i = parseInt(key.replace("rtier",""),10);
  return "Classement — "+(i===0?"1ers":(i+1)+"èmes")+" de poule";
}
function elimRoundLabel(key, cs){
  const round = parseInt(key.replace("elimR",""),10);
  const totalRounds = 1 + Math.ceil(Math.log2(cs.poolCount));
  if(round>=totalRounds) return "🏆 Finale";
  if(round===totalRounds-1) return "Demi-finales";
  return "Tour "+round+" — élimination directe";
}
function PHASE_LABEL_OR_POULE(cs,m){
  if(m.phase==="poule") return "Poule " + String.fromCharCode(65+m.poolIndex);
  if(typeof m.phase==="string" && m.phase.indexOf("rang")===0) return rangLabel(m.phase);
  if(typeof m.phase==="string" && m.phase.indexOf("rtier")===0) return tierLabel("rtier"+m.phase.replace("rtier","").split("_")[0]);
  if(typeof m.phase==="string" && m.phase.indexOf("elimR")===0) return elimRoundLabel(m.phase.split("_")[0], cs);
  return PHASE_LABELS[m.phase] || m.phase;
}

function renderMatches(t){
  const cs = t;
  const hasLive = !!liveMatchGlobal();
  if(!cs.matches.length) return '<div class="card"><p style="color:var(--muted)">Aucun match généré pour le moment.</p></div>';
  const byPhase = {};
  cs.matches.forEach(m=>{
    let key;
    if(m.phase==="poule") key = "poule"+m.poolIndex;
    else if(typeof m.phase==="string" && m.phase.indexOf("elimR")===0) key = m.phase.split("_")[0];
    else if(typeof m.phase==="string" && m.phase.indexOf("rtier")===0) key = "rtier"+m.phase.replace("rtier","").split("_")[0];
    else key = m.phase;
    (byPhase[key] = byPhase[key]||[]).push(m);
  });
  const poolKeys = [];
  for(let i=0;i<cs.poolCount;i++) if(byPhase["poule"+i]) poolKeys.push("poule"+i);
  const finalKeys = [];
  ["demi1","demi2","clDernier","cl3e","finale","cl34"].forEach(k=>{ if(byPhase[k]) finalKeys.push(k); });
  Object.keys(byPhase).filter(k=>k.indexOf("rang")===0)
    .sort((a,b)=>parseInt(a.replace("rang",""),10)-parseInt(b.replace("rang",""),10))
    .forEach(k=>finalKeys.push(k));
  Object.keys(byPhase).filter(k=>k.indexOf("rtier")===0)
    .sort((a,b)=>parseInt(a.replace("rtier",""),10)-parseInt(b.replace("rtier",""),10))
    .forEach(k=>finalKeys.push(k));
  Object.keys(byPhase).filter(k=>k.indexOf("elimR")===0)
    .sort((a,b)=>parseInt(a.replace("elimR",""),10)-parseInt(b.replace("elimR",""),10))
    .forEach(k=>finalKeys.push(k));
  const collapsed = isCollapsed("matches");
  let html = '<div class="card"><h2 class="collapsible-title" data-action="toggle-section" data-section="matches"><span>📋 Calendrier des matchs</span><span class="chevron'+(collapsed?" collapsed":"")+'">▾</span></h2>';
  if(!collapsed){
    const groupHtml = key=>{
      const list = byPhase[key];
      const isPool = key.startsWith("poule");
      const poolIdx = isPool ? parseInt(key.replace("poule",""),10) : null;
      const title = isPool ? "Poule " + String.fromCharCode(65+poolIdx)
        : key.indexOf("rang")===0 ? rangLabel(key)
        : key.indexOf("rtier")===0 ? tierLabel(key)
        : key.indexOf("elimR")===0 ? elimRoundLabel(key, cs)
        : PHASE_LABELS[key];
      const titleStyle = isPool ? ' style="color:'+poolColorVar(poolIdx)+';"' : '';
      let swapCtx = null;
      if(!isPool){
        const slots = [];
        list.forEach(m=>{
          if(m.status==="pending" && m.teamB!=null){
            slots.push({matchId:m.id, slot:"A", teamId:m.teamA});
            slots.push({matchId:m.id, slot:"B", teamId:m.teamB});
          }
        });
        if(slots.length>=4) swapCtx = {slots:slots};
      }
      return '<div class="phase-group"><div class="phase-title"'+titleStyle+'>🏐 '+title+'</div>'
        + (swapCtx ? '<div class="swap-hint">✏️ Vous pouvez échanger les équipes ci-dessous si besoin</div>' : '')
        + '<div class="match-list">'
        + list.map(m=> renderMatchRow(cs, m, !hasLive, swapCtx)).join("")
        + '</div></div>';
    };
    if(poolKeys.length>1){
      html += '<div class="pools-matches-row">' + poolKeys.map(k=>{
        const idx = parseInt(k.replace("poule",""),10);
        return '<div class="pool-color-block" style="--pc:'+poolColorVar(idx)+';--pt:'+poolTintVar(idx)+';">'+groupHtml(k)+'</div>';
      }).join("") + '</div>';
    } else {
      poolKeys.forEach(k=> html += groupHtml(k));
    }
    finalKeys.forEach(k=> html += groupHtml(k));
  }
  html += '</div>';
  return html;
}

      + '<div class="bracket-round">'
      +   '<div class="bracket-slot"><div class="bracket-label">Demi-finale 1</div>'+renderBracketMatch(cs,demi1)+'</div>'
      +   '<div class="bracket-slot"><div class="bracket-label">Demi-finale 2</div>'+renderBracketMatch(cs,demi2)+'</div>'
      + '</div>'
      + '<div class="bracket-lines"></div>'
      + '<div class="bracket-round bracket-final-round">'
      +   '<div class="bracket-slot"><div class="bracket-label">🏆 Finale</div>'+renderBracketMatch(cs,finale,"final")+'</div>'
      + '</div>'
      + '</div>'
      + (cl34 ? '<div class="bracket-third"><div class="bracket-label">Match pour la 3e place</div>'+renderBracketMatch(cs,cl34)+'</div>' : '')
      + '</div>';
  }
  html += '</div>';
  return html;
}
function renderFinalRanking(t){
  const cs = t;
  const ranking = computeFinalRanking(cs);
  if(!ranking) return "";
  const catLabel = CATEGORIES_BY_TYPE[t.gender].find(c=>c.key===t.category).label;
  const collapsed = isCollapsed("finalrank");
  let rank = 1;
  const rows = ranking.map(g=>{
    const label = g.teamIds.map(id=>teamColorDot(cs,id)+esc(teamName(cs,id))).join(" / ");
    const rankLabel = g.tied ? (rank+"-"+(rank+g.teamIds.length-1)+" ex æquo") : String(rank);
    const row = '<tr><td class="col-0"><b>'+rankLabel+'</b></td><td class="col-1">'+label+'</td></tr>';
    rank += g.teamIds.length;
    return row;
  }).join("");
  let html = '<div class="card"><h2 class="collapsible-title" data-action="toggle-section" data-section="finalrank"><span>🏆 Classement final — '+esc(catLabel)+'</span><span class="chevron'+(collapsed?" collapsed":"")+'">▾</span></h2>';
  if(!collapsed){
    html += '<div class="table-wrap"><table class="standings auto-width"><tr><th class="col-0">Rang</th><th class="col-1">Équipe</th></tr>'+rows+'</table></div>';
  }
  html += '</div>';
  return html;
}

function renderTournamentRecap(tab){
  const catDefs = CATEGORIES_BY_TYPE[tab];
  const sections = [];
  catDefs.forEach(def=>{
    const ctx = DB[tab][def.key];
    const ct = ctx.tournaments.find(x=>x.id===ctx.currentId);
    if(!ct) return;
    const ranking = computeFinalRanking(ct);
    if(!ranking) return;
    let rank = 1;
    const rows = ranking.map(g=>{
      const label = g.teamIds.map(id=>teamColorDot(ct,id)+esc(teamName(ct,id))).join(" / ");
      const rankLabel = g.tied ? (rank+"-"+(rank+g.teamIds.length-1)+" ex æquo") : String(rank);
      const row = '<tr><td class="col-0"><b>'+rankLabel+'</b></td><td class="col-1">'+label+'</td></tr>';
      rank += g.teamIds.length;
      return row;
    }).join("");
    sections.push('<div><h3>'+esc(def.label)+' — '+esc(ct.nom)+'</h3><div class="table-wrap"><table class="standings auto-width"><tr><th class="col-0">Rang</th><th class="col-1">Équipe</th></tr>'+rows+'</table></div></div>');
  });
  if(!sections.length) return "";
  const collapsed = isCollapsed("tournament_recap");
  let html = '<div class="card"><h2 class="collapsible-title" data-action="toggle-section" data-section="tournament_recap"><span>🏆 Classement récapitulatif du tournoi</span><span class="chevron'+(collapsed?" collapsed":"")+'">▾</span></h2>';
  if(!collapsed){
    html += '<div class="standings-row">'+sections.join("")+'</div>';
  }
  html += '</div>';
  return html;
}
function renderTournamentBody(t){
  let html = renderLiveBanner();
  html += renderEstablishmentConfig(t);
  html += renderTournamentRecap(DB.activeTab);
  html += renderCategoryConfig(t) + renderStandings(t) + renderBracket(t) + renderFinalRanking(t) + renderMatches(t);
  return html;
}

function renderNoTournament(){
  let html = '<div class="card empty-state">';
  if(!uiState.creating){
    html += '<p>😴 Aucun tournoi sélectionné pour cette catégorie.</p>'
      + '<button class="btn accent" data-action="new-tournament">➕ Créer un nouveau tournoi</button>';
  } else {
    html += '<div class="new-tournament-form">'
      + '<input type="text" id="newTournamentName" placeholder="Nom du tournoi (ex : Tournoi de secteur – automne)">'
      + '<button class="btn accent" data-action="create-tournament">✅ Créer</button>'
      + '<button class="btn" data-action="cancel-new-tournament">Annuler</button>'
      + '</div>';
  }
  html += '</div>';
  return html;
}

function renderTournamentBar(ctx, tournament){
  let html = '<div class="tournament-bar">';
  if(ctx.tournaments.length){
    html += '<select onchange="selectTournament(this.value)">';
    ctx.tournaments.forEach(t=>{
      const d = new Date(t.dateCreation).toLocaleDateString("fr-FR");
      html += '<option value="'+t.id+'" '+(t.id===ctx.currentId?"selected":"")+'>'+esc(t.nom)+' ('+d+')</option>';
    });
    html += '</select>';
    if(tournament){
      const tCollapsed = isCollapsed("tournamentBody");
      html += '<button class="btn" data-action="toggle-section" data-section="tournamentBody" title="'+(tCollapsed?"Afficher":"Masquer")+' le tournoi">'+(tCollapsed?"▸":"▾")+' '+(tCollapsed?"Afficher":"Masquer")+'</button>';
    }
    html += '<button class="btn" data-action="new-tournament">➕ Nouveau tournoi</button>';
    if(tournament) html += '<button class="btn danger" data-action="delete-tournament" data-id="'+tournament.id+'">🗑 Supprimer ce tournoi</button>';
  }
  html += '</div>';
  if(uiState.creating && ctx.tournaments.length){
    html += '<div class="card"><div class="new-tournament-form">'
      + '<input type="text" id="newTournamentName" placeholder="Nom du tournoi">'
      + '<button class="btn accent" data-action="create-tournament">✅ Créer</button>'
      + '<button class="btn" data-action="cancel-new-tournament">Annuler</button>'
      + '</div></div>';
  }
  return html;
}

function render(){
  const tab = DB.activeTab;
  const cat = DB.activeCategory[tab];
  const ctx = DB[tab][cat];
  const tournament = ctx.tournaments.find(t=>t.id===ctx.currentId) || null;
  document.getElementById("tabBtnM").classList.toggle("active", tab==="M");
  document.getElementById("tabBtnF").classList.toggle("active", tab==="F");
  const catTabsBar = document.getElementById("catTabsBar");
  const catDefs = CATEGORIES_BY_TYPE[tab];
  catTabsBar.innerHTML = catDefs.map(d=>
    '<button data-action="select-category" data-cat="'+d.key+'" class="'+(cat===d.key?"active":"")+'">'+esc(d.label)+'</button>'
  ).join("");
  catTabsBar.classList.remove("hidden");
  const app = document.getElementById("app");
  let html = renderTournamentBar(ctx, tournament);
  html += tournament ? (isCollapsed("tournamentBody") ? "" : renderTournamentBody(tournament)) : renderNoTournament();
  app.innerHTML = html;
}

/* ===================== EVENEMENTS ===================== */
document.body.addEventListener("click", e=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case "switch-tab": switchTab(el.dataset.tab); break;
    case "new-tournament": uiState.creating = true; render(); document.getElementById("newTournamentName")?.focus(); break;
    case "cancel-new-tournament": uiState.creating = false; render(); break;
    case "create-tournament": {
      const input = document.getElementById("newTournamentName");
      createTournament(input ? input.value : "");
      break;
    }
    case "delete-tournament": deleteTournament(el.dataset.id); break;
    case "select-category": switchCategory(el.dataset.cat); break;
    case "toggle-section": toggleSection(el.dataset.section); break;
    case "auto-split": autoSplit(); break;
    case "gen-schedule": genSchedule(); break;
    case "reset-category": resetCategory(); break;
    case "remove-estab": removeEstablishment(el.dataset.estab); break;
    case "start-match": startMatch(el.dataset.id); break;
    case "reopen-match": reopenMatch(el.dataset.id); break;
    case "pause-match": pauseMatch(el.dataset.id); break;
    case "resume-match": resumeMatch(el.dataset.id); break;
    case "reset-timer": resetTimer(el.dataset.id); break;
    case "goal-plus": addGoal(el.dataset.id, el.dataset.team, 1); break;
    case "goal-minus": addGoal(el.dataset.id, el.dataset.team, -1); break;
    case "finish-match": finishMatch(el.dataset.id); break;
    case "abandon-match": abandonMatch(el.dataset.id, el.dataset.team); break;
    case "shootout": setShootoutWinner(el.dataset.id, el.dataset.team); break;
    case "scroll-live": document.getElementById("liveBanner")?.scrollIntoView({behavior:"smooth"}); break;
    case "export-backup": exportBackup(); break;
  }
});
document.getElementById("importFile").addEventListener("change", e=>{
  importBackup(e.target.files[0]);
  e.target.value = "";
});

setInterval(()=>{
  const live = liveMatchGlobal();
  const el = document.getElementById("chronoDisplay");
  if(live && el){
    const rem = remainingSeconds(live.cs, live.m);
    el.textContent = formatRemaining(live.cs, live.m);
    el.classList.toggle("overtime", rem<0);
  }
}, 500);

render();
</script>
